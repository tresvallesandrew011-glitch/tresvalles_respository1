<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10151e">
    <title>Cube Lab | Home</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(ellipse at 12% 15%, rgb(24 217 219 / 14%), transparent 32%),
                radial-gradient(ellipse at 90% 65%, rgb(255 207 51 / 10%), transparent 30%),
                #10151e;
            color: #f5f7fa;
            font-family: Arial, sans-serif;
        }

        .site-header {
            border-bottom: 1px solid rgb(255 255 255 / 12%);
            background: rgb(16 21 30 / 94%);
        }

        .navbar {
            width: min(1100px, calc(100% - 40px));
            min-height: 72px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .brand {
            color: #ffcf33;
            font-size: 20px;
            font-weight: 800;
            text-decoration: none;
            white-space: nowrap;
        }

        .nav-links {
            display: flex;
            gap: 8px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .nav-links a {
            display: block;
            padding: 10px 14px;
            border-radius: 7px;
            color: #e5eaf1;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
        }

        .nav-links a:hover,
        .nav-links a:focus-visible {
            background: rgb(24 217 219 / 14%);
            color: #18d9db;
            outline: none;
        }

        main {
            flex: 1;
            width: min(1100px, calc(100% - 40px));
            margin: 0 auto;
            display: grid;
            place-items: center;
            padding: 48px 0;
            text-align: center;
            border-radius: 16px;
            background:
                linear-gradient(90deg, rgb(16 21 30 / 82%), rgb(16 21 30 / 38%)),
                url("home-hero.svg") center / cover no-repeat;
        }

        .home-content {
            width: min(100%, 620px);
            padding: 32px;
        }

        .eyebrow {
            margin: 0 0 12px;
            color: #ffcf33;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            color: #f5f7fa;
            font-size: clamp(34px, 7vw, 56px);
        }

        .intro {
            margin: 14px auto 26px;
            color: #c2ccd9;
            line-height: 1.7;
        }

        .cube-art {
            display: block;
            width: min(100%, 440px);
            height: auto;
            margin: 0 auto;
            filter: drop-shadow(0 14px 24px rgb(0 0 0 / 40%));
        }

        .back-link {
            display: inline-block;
            margin-top: 24px;
            padding: 12px 18px;
            border-radius: 7px;
            background: #18bfc6;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }

        .back-link:hover {
            background: #0e929b;
        }

        .back-link:focus-visible {
            outline: 3px solid #ffcf33;
            outline-offset: 3px;
        }

        footer {
            padding: 22px 20px;
            border-top: 1px solid rgb(255 255 255 / 12%);
            color: #aeb9c8;
            text-align: center;
            font-size: 14px;
        }

        @media (max-width: 520px) {
            .navbar {
                width: calc(100% - 24px);
                min-height: 64px;
                gap: 6px;
            }

            .brand {
                font-size: 16px;
            }

            .nav-links {
                gap: 0;
            }

            .nav-links a {
                padding: 9px 7px;
                font-size: 13px;
            }

            main {
                width: calc(100% - 24px);
            }

            .home-content {
                padding: 20px 4px;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <nav class="navbar" aria-label="Main navigation">
            <a class="brand" href="home.html">🧩 Cube Lab</a>
            <ul class="nav-links">
                <li><a href="home.html" aria-current="page">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="blogs.html">Blogs</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="home-content" aria-labelledby="page-title">
            <p class="eyebrow">Start with the basics</p>
            <h1 id="page-title">Your Cube Journey</h1>
            <p class="intro">Learn the beginner method one layer at a time, then practice until every move feels natural.</p>
            <svg class="cube-art" viewBox="0 0 440 330" role="img" aria-labelledby="cube-title cube-description" xmlns="http://www.w3.org/2000/svg">
                <title id="cube-title">A colorful Rubik's Cube</title>
                <desc id="cube-description">A three-dimensional puzzle cube showing a grid of colorful tiles.</desc>
                <path d="m220 35 150 75v170l-150 80-150-80V110z" fill="#10151e" stroke="#080b10" stroke-linejoin="round" stroke-width="14"/>
                <path d="m220 35 150 75-150 80-150-80z" fill="#ffcf33" stroke="#10151e" stroke-linejoin="round" stroke-width="9"/>
                <path d="m70 110 150 80v170L70 280z" fill="#f4f6f8" stroke="#10151e" stroke-linejoin="round" stroke-width="9"/>
                <path d="m220 190 150-80v170l-150 80z" fill="#18bfc6" stroke="#10151e" stroke-linejoin="round" stroke-width="9"/>
                <path d="m120 85 150 75m-100-100 150 75M120 137l150-80m-100 106 150-80M120 153v150m50-126v150m100-150v150m50-177v150m-200-70 150 80m-150-20 150 80m0-140 150-80m-150 130 150-80m-150 130 150-80" fill="none" stroke="#10151e" stroke-linecap="round" stroke-linejoin="round" stroke-width="8"/>
            </svg>
            <a class="back-link" href="landing page.html">Explore Cube Lab</a>
        </section>
    </main>

    <footer>Keep turning. Keep learning. 🧩</footer>
</body>
</html>
