<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10151e">
    <title>Cube Lab | Rubik's Cube Tutorials</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background: #10151e;
            color: #f5f7fa;
            font-family: Arial, sans-serif;
        }

        a {
            color: inherit;
        }

        .site-header {
            position: sticky;
            top: 0;
            z-index: 1;
            border-bottom: 1px solid rgb(255 255 255 / 12%);
            background: rgb(16 21 30 / 94%);
            backdrop-filter: blur(12px);
        }

        .navbar {
            width: min(1100px, 100% - 40px);
            min-height: 72px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .brand {
            color: #ffcf33;
            font-size: 20px;
            font-weight: 800;
            text-decoration: none;
            white-space: nowrap;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .nav-links a {
            display: block;
            padding: 10px 14px;
            border-radius: 7px;
            color: #e5eaf1;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            transition: color 150ms ease, background-color 150ms ease;
        }

        .nav-links a:hover,
        .nav-links a:focus-visible {
            background: rgb(24 217 219 / 14%);
            color: #18d9db;
            outline: none;
        }

        main {
            width: min(1100px, 100% - 40px);
            margin: 0 auto;
        }

        .hero {
            min-height: 490px;
            display: grid;
            align-content: center;
            justify-items: start;
            padding: 80px 0;
            color: #fff;
            background:
                linear-gradient(90deg, rgb(10 14 22 / 90%), rgb(10 14 22 / 58%) 58%, rgb(10 14 22 / 30%)),
                url("images.jpg") center / cover no-repeat;
            border-radius: 14px;
        }

        .eyebrow {
            margin: 0 0 16px;
            color: #ffcf33;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h1 {
            max-width: 700px;
            margin: 0;
            color: #fff;
            font-size: clamp(42px, 8vw, 76px);
            line-height: 1.05;
        }

        .hero-copy {
            max-width: 570px;
            margin: 20px 0 28px;
            color: #e0e6ef;
            font-size: 18px;
            line-height: 1.7;
        }

        .primary-link {
            display: inline-block;
            padding: 13px 20px;
            border-radius: 7px;
            background: #18bfc6;
            color: white;
            font-weight: 700;
            text-decoration: none;
            transition: background-color 150ms ease, transform 150ms ease;
        }

        .primary-link:hover {
            transform: translateY(-1px);
            background: #0e929b;
        }

        .primary-link:focus-visible {
            outline: 3px solid #ffcf33;
            outline-offset: 3px;
        }

        @media (max-width: 640px) {
            .navbar {
                width: calc(100% - 28px);
                min-height: 64px;
                gap: 8px;
            }

            .brand {
                font-size: 17px;
            }

            .nav-links {
                gap: 0;
            }

            .nav-links a {
                padding: 9px 8px;
                font-size: 14px;
            }

            main {
                width: calc(100% - 36px);
            }

            .hero {
                min-height: 420px;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <nav class="navbar" aria-label="Main navigation">
            <a class="brand" href="home.html">🧩 Cube Lab</a>
            <ul class="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="blogs.html">Blogs</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero" id="home">
            <p class="eyebrow">Your first move starts here</p>
            <h1>Learn to solve the Rubik's Cube.</h1>
            <p class="hero-copy">Follow clear, beginner-friendly tutorials to understand the moves, master each layer, and solve your cube with confidence.</p>
            <a class="primary-link" href="services.html">Start learning</a>
        </section>
    </main>
</body>
</html>
