<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10151e">
    <title>Cube Lab | Tutorials</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(ellipse at 12% 15%, rgb(24 217 219 / 14%), transparent 32%),
                radial-gradient(ellipse at 90% 65%, rgb(255 207 51 / 10%), transparent 30%),
                #10151e;
            color: #f5f7fa;
            font-family: Arial, sans-serif;
        }

        .site-header {
            border-bottom: 1px solid rgb(255 255 255 / 12%);
            background: rgb(16 21 30 / 94%);
        }

        .navbar {
            width: min(1100px, calc(100% - 40px));
            min-height: 72px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .brand {
            color: #ffcf33;
            font-size: 20px;
            font-weight: 800;
            text-decoration: none;
            white-space: nowrap;
        }

        .nav-links {
            display: flex;
            gap: 8px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .nav-links a {
            display: block;
            padding: 10px 14px;
            border-radius: 7px;
            color: #e5eaf1;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
        }

        .nav-links a:hover,
        .nav-links a:focus-visible,
        .nav-links a[aria-current="page"] {
            background: rgb(24 217 219 / 14%);
            color: #18d9db;
            outline: none;
        }

        main {
            flex: 1;
            width: min(1100px, calc(100% - 40px));
            margin: 0 auto;
            display: grid;
            place-items: center;
            padding: 40px 0;
            text-align: center;
            border-radius: 16px;
            background:
                linear-gradient(90deg, rgb(16 21 30 / 82%), rgb(16 21 30 / 38%)),
                url("services-hero.svg") center / cover no-repeat;
        }

        .service-content {
            width: min(100%, 660px);
            padding: 24px;
        }

        .eyebrow {
            margin: 0 0 12px;
            color: #ffcf33;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            color: #f5f7fa;
            font-size: clamp(34px, 7vw, 56px);
        }

        .intro {
            max-width: 520px;
            margin: 14px auto 20px;
            color: #c2ccd9;
            line-height: 1.7;
        }

        .tutorial-art {
            display: block;
            width: min(100%, 390px);
            height: auto;
            margin: 0 auto;
            filter: drop-shadow(0 14px 24px rgb(0 0 0 / 40%));
        }

        .back-link {
            display: inline-block;
            margin-top: 12px;
            padding: 12px 18px;
            border-radius: 7px;
            background: #18bfc6;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }

        .back-link:hover {
            background: #0e929b;
        }

        .back-link:focus-visible {
            outline: 3px solid #ffcf33;
            outline-offset: 3px;
        }

        footer {
            padding: 22px 20px;
            border-top: 1px solid rgb(255 255 255 / 12%);
            color: #aeb9c8;
            text-align: center;
            font-size: 14px;
        }

        @media (max-width: 520px) {
            .navbar {
                width: calc(100% - 24px);
                min-height: 64px;
                gap: 6px;
            }

            .brand {
                font-size: 16px;
            }

            .nav-links {
                gap: 0;
            }

            .nav-links a {
                padding: 9px 7px;
                font-size: 13px;
            }

            main {
                width: calc(100% - 24px);
            }

            .service-content {
                padding: 20px 4px;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <nav class="navbar" aria-label="Main navigation">
            <a class="brand" href="landing page.html">🧩 Cube Lab</a>
            <ul class="nav-links">
                <li><a href="services.html" aria-current="page">Services</a></li>
                <li><a href="blogs.html">Blogs</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="service-content" aria-labelledby="page-title">
            <p class="eyebrow">Learn one move at a time</p>
            <h1 id="page-title">Step-by-Step Tutorials</h1>
            <p class="intro">Build your solving skills with a beginner-friendly method: solve the first layer, complete the middle, then finish the last layer.</p>
            <svg class="tutorial-art" viewBox="0 0 400 440" role="img" aria-labelledby="tutorial-title tutorial-description" xmlns="http://www.w3.org/2000/svg">
                <title id="tutorial-title">Three stages of learning to solve a Rubik's Cube</title>
                <desc id="tutorial-description">Three colorful cube diagrams illustrate the first layer, middle layer, and final layer.</desc>
                <g transform="translate(10 65)">
                    <rect x="0" y="0" width="110" height="250" rx="16" fill="#17202d" stroke="#324155" stroke-width="4"/>
                    <path d="m55 25 37 19v67l-37 20-37-20V44z" fill="#f5f7fa" stroke="#10151e" stroke-width="7"/>
                    <path d="m55 25 37 19-37 20-37-20z" fill="#ffcf33" stroke="#10151e" stroke-width="5"/>
                    <path d="m18 44 37 20v67l-37-20z" fill="#18bfc6" stroke="#10151e" stroke-width="5"/>
                    <path d="m55 64 37-20v67l-37 21z" fill="#f5f7fa" stroke="#10151e" stroke-width="5"/>
                    <text x="55" y="177" fill="#f5f7fa" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">FIRST</text>
                    <text x="55" y="198" fill="#aeb9c8" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">LAYER</text>
                </g>
                <g transform="translate(145 65)">
                    <rect x="0" y="0" width="110" height="250" rx="16" fill="#17202d" stroke="#324155" stroke-width="4"/>
                    <path d="m55 25 37 19v67l-37 20-37-20V44z" fill="#f5f7fa" stroke="#10151e" stroke-width="7"/>
                    <path d="m55 25 37 19-37 20-37-20z" fill="#ff6b35" stroke="#10151e" stroke-width="5"/>
                    <path d="m18 44 37 20v67l-37-20z" fill="#ffcf33" stroke="#10151e" stroke-width="5"/>
                    <path d="m55 64 37-20v67l-37 21z" fill="#18bfc6" stroke="#10151e" stroke-width="5"/>
                    <text x="55" y="177" fill="#f5f7fa" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">MIDDLE</text>
                    <text x="55" y="198" fill="#aeb9c8" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">LAYER</text>
                </g>
                <g transform="translate(280 65)">
                    <rect x="0" y="0" width="110" height="250" rx="16" fill="#17202d" stroke="#324155" stroke-width="4"/>
                    <path d="m55 25 37 19v67l-37 20-37-20V44z" fill="#f5f7fa" stroke="#10151e" stroke-width="7"/>
                    <path d="m55 25 37 19-37 20-37-20z" fill="#18bfc6" stroke="#10151e" stroke-width="5"/>
                    <path d="m18 44 37 20v67l-37-20z" fill="#ff6b35" stroke="#10151e" stroke-width="5"/>
                    <path d="m55 64 37-20v67l-37 21z" fill="#ffcf33" stroke="#10151e" stroke-width="5"/>
                    <text x="55" y="177" fill="#f5f7fa" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">FINAL</text>
                    <text x="55" y="198" fill="#aeb9c8" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">LAYER</text>
                </g>
            </svg>
            <a class="back-link" href="landing page.html">Back to Cube Lab</a>
        </section>
    </main>

    <footer>Keep turning. Keep learning. 🧩</footer>
</body>
</html>
