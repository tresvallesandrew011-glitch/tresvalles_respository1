<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#100b18">
    <title>Midnight Hollow | Services</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(ellipse at 12% 15%, rgb(112 48 145 / 20%), transparent 32%),
                radial-gradient(ellipse at 90% 65%, rgb(255 111 0 / 14%), transparent 30%),
                #100b18;
            color: #fffaf3;
            font-family: Arial, sans-serif;
        }

        .site-header {
            border-bottom: 1px solid rgb(240 213 181 / 16%);
            background: rgb(16 11 24 / 94%);
        }

        .navbar {
            width: min(1100px, calc(100% - 40px));
            min-height: 72px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .brand {
            color: #ff9b43;
            font-size: 20px;
            font-weight: 800;
            text-decoration: none;
            white-space: nowrap;
        }

        .nav-links {
            display: flex;
            gap: 8px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .nav-links a {
            display: block;
            padding: 10px 14px;
            border-radius: 7px;
            color: #eee4f1;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
        }

        .nav-links a:hover,
        .nav-links a:focus-visible {
            background: rgb(139 74 165 / 22%);
            color: #ffad64;
            outline: none;
        }

        main {
            flex: 1;
            width: min(1100px, calc(100% - 40px));
            margin: 0 auto;
            display: grid;
            place-items: center;
            padding: 40px 0;
            text-align: center;
        }

        .service-content {
            width: min(100%, 660px);
            padding: 24px;
        }

        .eyebrow {
            margin: 0 0 12px;
            color: #ff9b43;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            color: #fffaf3;
            font-size: clamp(34px, 7vw, 56px);
        }

        .intro {
            max-width: 520px;
            margin: 14px auto 20px;
            color: #c9bacf;
            line-height: 1.7;
        }

        .butler-art {
            display: block;
            width: min(100%, 390px);
            height: auto;
            margin: 0 auto;
            filter: drop-shadow(0 14px 24px rgb(0 0 0 / 40%));
        }

        .back-link {
            display: inline-block;
            margin-top: 12px;
            padding: 12px 18px;
            border-radius: 7px;
            background: #e96818;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }

        .back-link:hover {
            background: #c94e0d;
        }

        .back-link:focus-visible {
            outline: 3px solid #ffad64;
            outline-offset: 3px;
        }

        footer {
            padding: 22px 20px;
            border-top: 1px solid rgb(240 213 181 / 15%);
            color: #a99aad;
            text-align: center;
            font-size: 14px;
        }

        @media (max-width: 520px) {
            .navbar {
                width: calc(100% - 24px);
                min-height: 64px;
                gap: 6px;
            }

            .brand {
                font-size: 16px;
            }

            .nav-links {
                gap: 0;
            }

            .nav-links a {
                padding: 9px 7px;
                font-size: 13px;
            }

            main {
                width: calc(100% - 24px);
            }

            .service-content {
                padding: 20px 4px;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <nav class="navbar" aria-label="Main navigation">
            <a class="brand" href="home.html">🎃 Midnight Hollow</a>
            <ul class="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="services.html" aria-current="page">Services</a></li>
                <li><a href="blogs.html">Blogs</a></li>
            </ul>
        </nav>
    </header>

    <main>

            <h1 id="page-title">A Most Spooktacular Welcome</h1>

            </svg>
            <a class="back-link" href="landing page.html">Back to the Landing Page</a>
        </section>
    </main>

    <footer>Made for magical October nights. 🎃</footer>
</body>
</html>
